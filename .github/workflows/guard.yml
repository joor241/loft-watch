name: loft-guard

# Bewaker: controleert elke 30s de hartslag van de scanner (watch.yml). Blijft
# die >4 min weg: push, scanner herstarten en zelf doorscannen tot hij terug is.
# Kortere looptijd dan de scanner, zodat hun overdrachten nooit samenvallen.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

concurrency:
  group: loft-guard
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  statuses: write
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 325
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run guard
        env:
          TZ: Europe/Amsterdam
          GITHUB_TOKEN: ${{ github.token }}
          LOFT_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOFT_MAX_RUNTIME_MIN: "310"
          LOFT_COMMIT_STATE: "1"
          LOFT_POLL_SECONDS: ${{ vars.LOFT_POLL_SECONDS || '20' }}
          LOFT_TARGET_NAMES: ${{ vars.LOFT_TARGET_NAMES || 'mau p,dennis cruz' }}
          LOFT_TARGET_DATE: ${{ vars.LOFT_TARGET_DATE || '2026-10-24' }}
          LOFT_TARGET_TIME: ${{ vars.LOFT_TARGET_TIME || '14:30' }}
        run: |
          git config user.name "loft-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python loft_watch.py --guard
      - name: Ensure next run
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python loft_watch.py --ensure-successor guard.yml
